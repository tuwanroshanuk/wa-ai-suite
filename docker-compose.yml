services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wa_pass}
      POSTGRES_DB: ${POSTGRES_DB:-wa_suite}
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  tts-service:
    build: ./tts-service
    restart: unless-stopped
    environment:
      - PORT=6000

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - tts-service
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-wa_user}:${POSTGRES_PASSWORD:-wa_pass}@postgres:5432/${POSTGRES_DB:-wa_suite}
      - REDIS_URL=redis://redis:6379
      - TTS_SERVICE_URL=http://tts-service:6000
    ports:
      # WebRTC/ICE media. These UDP ports must also be allowed by the VDS firewall.
      - "49152-65535:49152-65535/udp"
    volumes:
      - recordings:/app/recordings

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  recordings:
